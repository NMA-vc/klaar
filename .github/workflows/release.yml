name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: 0.22.1

jobs:
  release-gate:
    name: Test, Audit & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Verify release source
        run: |
          test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "klaar") | .version')" = "$GITHUB_REF_NAME"
          cargo test --locked --workspace --all-features --lib --bins --tests
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo audit
          cargo package --locked

  build:
    name: Build Binary
    needs: release-gate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: klaar-linux-x86_64
            binary_name: klaar
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact_name: klaar-macos-x86_64
            binary_name: klaar
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: klaar-macos-aarch64
            binary_name: klaar
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: klaar-windows-x86_64
            binary_name: klaar.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: target/${{ matrix.target }}/release/${{ matrix.binary_name }} --version

      - name: Smoke test binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: '& "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" --version'

      - name: Packaging (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact_name }}.tar.gz ${{ matrix.binary_name }}
          cd ../../..

      - name: Verify packaged binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir artifact-smoke
          tar -xzf ${{ matrix.artifact_name }}.tar.gz -C artifact-smoke
          artifact-smoke/${{ matrix.binary_name }} --version

      - name: Packaging (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Verify packaged binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Expand-Archive -Path "${{ matrix.artifact_name }}.zip" -DestinationPath artifact-smoke
          & "artifact-smoke/${{ matrix.binary_name }}" --version

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Move artifacts to root dist
        run: |
          mkdir -p final-dist
          find dist -name "*.tar.gz" -exec cp {} final-dist/ \;
          find dist -name "*.zip" -exec cp {} final-dist/ \;
          ls -R final-dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: cyclonedx-json
          output-file: final-dist/sbom.cyclonedx.json

      - name: Generate SHA256SUMS
        run: |
          cd final-dist
          sha256sum ./*.tar.gz ./*.zip ./sbom.cyclonedx.json > SHA256SUMS
          cd ..

      - name: Verify checksums
        run: cd final-dist && sha256sum --check SHA256SUMS

      - name: Sign artifacts with Cosign (Keyless via OIDC)
        run: |
          cd final-dist
          for file in ./*.tar.gz ./*.zip ./sbom.cyclonedx.json ./SHA256SUMS; do
            cosign sign-blob --yes --output-signature "$file.sig" --output-certificate "$file.pem" "$file"
          done
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            final-dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish crates.io package
    if: vars.PUBLISH_CRATES_IO == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
