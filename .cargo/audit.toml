[advisories]
ignore = [
    # bincode 1.3.3 — unmaintained (RUSTSEC-2025-0141)
    # Transitive dependency of surrealdb. No action available until surrealdb
    # upgrades its internal serialization layer.
    "RUSTSEC-2025-0141",

    # atomic-polyfill 1.0.3 — unmaintained (RUSTSEC-2023-0089)
    # Transitive dependency of surrealdb. Tracked upstream.
    "RUSTSEC-2023-0089",

    # lru 0.12.5 — unsound (RUSTSEC-2026-0002)
    # Declared by pinned surrealkv 0.9.3, whose Rust sources contain no lru
    # call sites. Re-audit reachability before every surrealkv update.
    "RUSTSEC-2026-0002",

    # lru 0.12.5 — potential use-after-free (RUSTSEC-2026-0253)
    # Same currently unreachable surrealkv 0.9.3 declaration as above.
    "RUSTSEC-2026-0253",

    # rkyv 0.7.46 — archive validation (RUSTSEC-2026-0235)
    # Present only as rust_decimal's disabled optional feature in Cargo.lock;
    # `cargo tree -i rkyv --target all` has no active dependency path.
    "RUSTSEC-2026-0235",

    # number_prefix 0.4.0 — unmaintained (RUSTSEC-2025-0119)
    # Transitive dependency of fastembed (via indicatif -> hf-hub).
    # No active security vulnerability. Tracked upstream for removal.
    "RUSTSEC-2025-0119",

    # paste 1.0.15 — unmaintained (RUSTSEC-2024-0436)
    # Transitive dependency of fastembed (via tokenizers).
    # No active security vulnerability. Tracked upstream for removal.
    "RUSTSEC-2024-0436",
]
